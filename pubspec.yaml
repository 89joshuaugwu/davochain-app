name: davochain
version: 0.13.0+18
publish_to: 'none'
description: Davochain Flutter mobile application.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 400
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 500
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 700
  assets:
    - assets/images/banks/
    - assets/images/brand/
    - assets/images/onboarding/
    - assets/images/dashboard/
    - assets/images/figma/
    - assets/images/figma/crypto_full/
    - assets/images/figma/gift_cards/
    - assets/icons/auth/
    - assets/icons/figma/
    - assets/figma_exact/

flutter_native_splash:
  color: "#135CF7"
  image: assets/images/brand/native_splash_lockup.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#135CF7"
    image: assets/images/brand/native_splash_mark_android12.png
    icon_background_color: "#135CF7"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/brand/app_icon.png
  adaptive_icon_background: "#135CF7"
  adaptive_icon_foreground: assets/images/brand/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#135CF7"
  
