name: davochain
version: 0.8.0+9
publish_to: 'none'
description: Davochain Flutter mobile application.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
    - assets/images/onboarding/
    - assets/images/dashboard/
    - assets/images/figma/
    - assets/images/figma/crypto_full/
    - assets/icons/auth/
    - assets/icons/figma/

flutter_native_splash:
  color: "#135CF7"
  image: assets/images/brand/native_splash_lockup.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#135CF7"
    image: assets/images/brand/native_splash_mark_android12.png
    icon_background_color: "#135CF7"
  