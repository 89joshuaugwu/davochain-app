name: davochain
version: 0.19.1+50
publish_to: 'none'
description: Davochain Flutter mobile application.

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  sqflite: 2.4.4+2
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  # ReceiptPdfFont repairs non-BMP ToUnicode mappings in this exact API.
  pdf: 3.13.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  camera: ^0.12.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  flutter_tts: ^4.2.5
  local_auth: ^3.0.2
  google_mlkit_face_detection: ^0.15.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.4.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 400
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 500
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Variable.ttf
          weight: 700
    - family: DavoNotoSans
      fonts:
        - asset: assets/fonts/noto/NotoSans-Regular.ttf
    - family: DavoNotoMath
      fonts:
        - asset: assets/fonts/noto/NotoSansMath-Regular.ttf
    - family: DavoNotoEmoji
      fonts:
        - asset: assets/fonts/noto/NotoEmoji.ttf
  assets:
    - assets/fonts/noto/
    - assets/images/banks/
    - assets/images/brand/
    - assets/images/appearance/
    - assets/images/onboarding/
    - assets/images/dashboard/
    - assets/images/figma/
    - assets/images/figma/crypto_full/
    - assets/images/figma/gift_cards/
    - assets/licenses/
    - assets/icons/settings/
    - assets/icons/crypto/
    - assets/icons/gift/
    - assets/icons/auth/
    - assets/icons/figma/
    - assets/figma_exact/

flutter_native_splash:
  color: "#135CF7"
  image: assets/images/brand/native_splash_lockup.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#135CF7"
    image: assets/images/brand/native_splash_mark_android12.png
    icon_background_color: "#135CF7"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/brand/app_icon.png
  adaptive_icon_background: "#135CF7"
  adaptive_icon_foreground: assets/images/brand/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#135CF7"
  
